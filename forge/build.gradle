plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '7.0.31'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id + "-forge"
}

// Mojang ships Java 25 to end users in 26.2+, so your mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    dependency "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    mappings channel: mapping_channel, version: mapping_version

    // copyIdeResources = true

    runs {
        configureEach {
            workingDir = project.file('run')

            systemProperties['forge.logging.markers'] = 'REGISTRIES'
            systemProperties['forge.logging.console.level'] = 'debug'
            systemProperties['org.lwjgl.glfw.platform'] = 'X11'
            environment['XDG_SESSION_TYPE'] = 'x11'
            jvmArgs '-Dorg.lwjgl.glfw.platform=x11'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            systemProperties['forge.enabledGameTestNamespaces'] = mod_id
        }

        server {
            systemProperties['forge.enabledGameTestNamespaces'] = mod_id
            args '--nogui'
        }

        gameTestServer {
            systemProperties['forge.enabledGameTestNamespaces'] = mod_id
        }

        data {
            workingDir = project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/'), '--existing', project(':common').file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir rootProject.project(':common').file('src/main/resources')
}
sourceSets.main.output.resourcesDir = file("$buildDir/classes/java/main")

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net/'
    }
    minecraft.mavenizer(it)
}

// Merge the common (loader-agnostic) Java sources directly into this project's
// source set so they compile into forge/build/classes/java/main. This gives
// ForgeGradle exactly one classes directory for the mod module and avoids the
// JPMS split-package ResolutionException that occurs when the common jar is
// present as a separate module on the module path alongside the forge classes.
sourceSets.main.java {
    srcDirs += project(':common').sourceSets.main.java.srcDirs
}

dependencies {
    implementation minecraft.dependency
}


tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from project(':common').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
